<meta charset="utf-8">

<title>関門モータース｜北九州市のレッカー・ロードサービス</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:#eef4f8;color:#102338;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
 padding-bottom:84px;
}
.lp{width:min(100%,760px);margin:0 auto;background:#075ca8}
.hero,.lower{position:relative}
.hero img,.lower img{display:block;width:100%;height:auto}
.hot{position:absolute;display:block;z-index:5}
.hero-call{right:3%;bottom:4%;width:34%;height:18%}
.lower-main-call{left:27%;top:70%;width:69%;height:19%}
.lower-bottom-call{left:1%;bottom:.4%;width:49%;height:8%}
.lower-bottom-form{right:1%;bottom:.4%;width:49%;height:8%}

.form-section{padding:32px 14px 42px;background:#f3f7fa}
.form-card{max-width:720px;margin:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 12px 28px rgba(3,38,70,.15)}
.form-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.form-icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#e7f3ff;font-size:26px;flex:0 0 auto}
.form-head h2{margin:0;font-size:24px}
.form-head p{margin:3px 0 0;color:#64717c;font-size:13px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;font-weight:900;margin:9px 0 5px}
.req{color:#e31f26;font-size:10px}
input,textarea{width:100%;border:1px solid #cbd7e1;border-radius:11px;padding:12px 13px;font:inherit;background:#fff;outline:none}
textarea{min-height:100px;resize:vertical}
.full{grid-column:1/-1}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{margin:0}
.choice input{display:none}
.choice span{display:block;border:1px solid #ccd7e1;border-radius:10px;padding:11px 5px;text-align:center;font-size:12px;font-weight:900;cursor:pointer}
.choice input:checked+span{background:#e7f3ff;border-color:#075ca8;color:#075ca8}
.submit{width:100%;border:0;border-radius:13px;background:linear-gradient(90deg,#ffd028,#ffdf57);color:#3d3000;padding:15px;margin-top:17px;font-size:17px;font-weight:1000}
.note{font-size:10px;color:#64717c;text-align:center;margin:8px 0 0}
.fixed{position:fixed;z-index:99;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.08fr;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);box-shadow:0 -8px 22px rgba(0,0,0,.14)}
.fixed a{color:#fff;text-align:center;border-radius:12px;padding:13px 5px;font-size:15px;font-weight:1000;text-decoration:none}
.fixed-phone{background:#e61b1b}
.fixed-form{background:#0b5da7}
@media(max-width:620px){
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .choices{grid-template-columns:repeat(2,1fr)}
}
</style>
<style id="complete-cta-buttons-fix">
.lower{
  overflow:hidden;
  background:#075ca8;
}
.lower img{
  width:100%;
 clip-path:inset(0);
 margin-bottom:0;
}

.lower-bottom-call,
.lower-bottom-form{
  display:none !important;
}
.complete-cta-row{
  width:min(100%,760px);
  margin:0 auto;
  padding:10px 12px 14px;
  display:grid;
  grid-template-columns:1fr 1.12fr;
  gap:10px;
  background:#075ca8;
}
.complete-cta-row a{
  min-height:58px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:#fff;
  text-decoration:none;
  font-weight:900;
  font-size:clamp(16px,3vw,24px);
  border:2px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
.complete-phone{
  background:linear-gradient(#ef2a20,#c90000);
}
.complete-form{
  background:linear-gradient(#1478c9,#064d99);
}
.complete-cta-row .ico{
  font-size:1.25em;
  line-height:1;
}
@media(max-width:460px){
  .complete-cta-row{gap:7px;padding:8px 8px 12px}
  .complete-cta-row a{min-height:52px;font-size:14px;border-radius:14px}
}
/* 対応事例 */
.cases-section{
  background:#fff;
  padding:40px 16px;
}
.cases-inner{
  max-width:760px;
  margin:0 auto;
}
.cases-title{
  text-align:center;
  font-size:26px;
  font-weight:900;
  margin:0 0 8px;
}
.cases-lead{
  text-align:center;
  margin:0 0 24px;
  color:#555;
}
.cases-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.case-card{
  overflow:hidden;
  border-radius:14px;
  background:#fff;
  box-shadow:0 3px 14px rgba(0,0,0,.12);
}
.case-card img{
  display:block;
  width:100%;
  height:190px;
  object-fit:cover;
}
.case-card p{
  margin:0;
  padding:11px 8px;
  text-align:center;
  font-weight:800;
}
@media(max-width:600px){
  .cases-grid{
    grid-template-columns:1fr;
  }
  .case-card img{
    height:auto;
    aspect-ratio:16/10;
  }
}
</style>

</head>

<script>
(function() {
  const form = document.getElementById('requestForm');
  const status = document.getElementById('formStatus');
  if (!form) return;

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    if (!form.reportValidity()) return;

    const submit = form.querySelector('button.submit');
    const data = new URLSearchParams(new FormData(form));

    submit.disabled = true;
    submit.textContent = '送信中…';
    if (status) status.textContent = '送信しています。';

    try {
      await fetch('https://script.google.com/macros/s/AKfycbwL6-zoqGQ3SjGPGzxIhKRdXKPnA9JRNKXpAX4H3Ll26KQrQQUwq3TlvzLVU7xPPhSAmA/exec', {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
        body: data.toString()
      });

      form.reset();
      if (status) status.textContent = '送信しました。内容を確認後、こちらからご連絡します。';
      alert('お問い合わせを送信しました。');
    } catch (err) {
      if (status) status.textContent = '送信できませんでした。お手数ですがお電話でお問い合わせください。';
      alert('送信できませんでした。お手数ですがお電話でお問い合わせください。');
    } finally {
      submit.disabled = false;
      submit.textContent = '無料お問合せフォームを送信';
    }
  });
})();
</script>
